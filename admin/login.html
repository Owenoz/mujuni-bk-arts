<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Mujuni BK Arts</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{--p:#2c1810;--a:#d4a574;--g:#f4e4c1;--dk:#0e0b08;}
    body{font-family:'Inter',sans-serif;background:var(--dk);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}

    /* animated paint blobs */
    .blob{position:fixed;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none;animation:blobFloat 8s ease-in-out infinite;}
    .blob1{width:500px;height:500px;background:var(--a);top:-100px;left:-100px;animation-delay:0s;}
    .blob2{width:400px;height:400px;background:#8b4513;bottom:-80px;right:-80px;animation-delay:3s;}
    .blob3{width:300px;height:300px;background:var(--g);top:40%;right:20%;opacity:.06;animation-delay:5s;}
    @keyframes blobFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-30px) scale(1.05);}}

    /* grain overlay */
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.4;}

    .card{position:relative;z-index:1;background:rgba(26,20,16,.85);border:1px solid rgba(212,165,116,.18);border-radius:12px;padding:3.5rem;width:100%;max-width:420px;backdrop-filter:blur(30px);box-shadow:0 40px 100px rgba(0,0,0,.7);}

    .logo{text-align:center;margin-bottom:2.5rem;}
    .logo-name{font-family:'Dancing Script',cursive;font-size:2.2rem;font-weight:700;color:var(--a);display:block;}
    .logo-tag{font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;color:rgba(212,165,116,.5);margin-top:.25rem;display:block;}

    .card-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:600;color:#fff;text-align:center;margin-bottom:.4rem;}
    .card-sub{font-size:.78rem;color:rgba(255,255,255,.35);text-align:center;margin-bottom:2.5rem;letter-spacing:.03em;}

    .field{margin-bottom:1.4rem;}
    .field label{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:.5rem;font-weight:500;}
    .input-wrap{position:relative;}
    .input-wrap i{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:rgba(212,165,116,.5);font-size:.9rem;}
    .field input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(212,165,116,.15);border-radius:8px;padding:.9rem 1rem .9rem 2.8rem;color:#fff;font-family:'Inter',sans-serif;font-size:.9rem;outline:none;transition:border-color .3s,background .3s;}
    .field input::placeholder{color:rgba(255,255,255,.2);}
    .field input:focus{border-color:var(--a);background:rgba(212,165,116,.06);}
    .toggle-pw{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:.9rem;transition:color .3s;padding:0;}
    .toggle-pw:hover{color:var(--a);}

    .error{display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:6px;padding:.75rem 1rem;color:#f87171;font-size:.78rem;margin-bottom:1.25rem;align-items:center;gap:.6rem;}
    .error.show{display:flex;}

    .btn-login{width:100%;background:linear-gradient(135deg,#f4e4c1,var(--a),#c8955c);color:var(--dk);border:none;border-radius:8px;padding:1rem;font-family:'Inter',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .35s;position:relative;overflow:hidden;margin-top:.5rem;}
    .btn-login::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transition:.6s;}
    .btn-login:hover::before{left:100%;}
    .btn-login:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(212,165,116,.45);}
    .btn-login:active{transform:translateY(0);}
    .btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none;}

    .back-link{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:2rem;color:rgba(255,255,255,.25);font-size:.73rem;text-decoration:none;transition:color .3s;}
    .back-link:hover{color:var(--a);}

    .spinner{display:none;width:18px;height:18px;border:2px solid rgba(44,24,16,.3);border-top-color:var(--dk);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .btn-login.loading .btn-text{display:none;}
    .btn-login.loading .spinner{display:block;}
  </style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="card">
    <div class="logo">
      <span class="logo-name">Mujuni BK Arts</span>
      <span class="logo-tag">Admin Portal</span>
    </div>

    <h2 class="card-title">Welcome back</h2>
    <p class="card-sub">Sign in to manage your gallery</p>

    <div class="error" id="errorBox">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorMsg">Incorrect password. Please try again.</span>
    </div>

    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="field">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="username" placeholder="admin" autocomplete="username" required>
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" onclick="togglePw()" id="eyeBtn">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text"><i class="fas fa-sign-in-alt" style="margin-right:.5rem;"></i>Sign In</span>
        <div class="spinner"></div>
      </button>
    </form>

    <a href="../index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to website
    </a>
  </div>

  <script>
    // Check already logged in
    if (sessionStorage.getItem('mbk_admin') === 'true') {
      window.location.href = 'index.html';
    }

    // Credentials — change password here
    const ADMIN_USER = 'mujuni';
    const ADMIN_PASS = 'mujunibkarts2026';

    function togglePw() {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorBox');
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      err.classList.remove('show');
      btn.classList.add('loading');
      btn.disabled = true;

      // Simulate slight delay for UX
      setTimeout(() => {
        if (user === ADMIN_USER && pass === ADMIN_PASS) {
          sessionStorage.setItem('mbk_admin', 'true');
          window.location.href = 'index.html';
        } else {
          btn.classList.remove('loading');
          btn.disabled = false;
          err.classList.add('show');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
          // Shake the card
          const card = document.querySelector('.card');
          card.style.animation = 'shake .4s ease';
          setTimeout(() => card.style.animation = '', 400);
        }
      }, 800);
    }

    // Shake keyframe injected
    const style = document.createElement('style');
    style.textContent = '@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-8px);}40%,80%{transform:translateX(8px);}}';
    document.head.appendChild(style);
  </script>
</body>
</html>
